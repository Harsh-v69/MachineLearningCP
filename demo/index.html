<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E7ECEF; --surface:#F5F8FA; --sunken:#DAE2E7; --ink:#13202B; --muted:#55666F; --rule:#C3CED5;
  --accent:#2B59FF; --accent-ink:#FFFFFF; --ok:#26875A; --warn:#D98319; --bad:#D23F2F;
  --wall:#2A3A47; --crate:#C9822F; --v1:#7C8B96; --v2:#A0AEB8; --v3:#5F707C; --v4:#93A1AB;
  --plan-a:#2B59FF; --plan-b:#D98319;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E151B; --surface:#16212A; --sunken:#0A1015; --ink:#E7EEF3; --muted:#93A4B1; --rule:#2A3945;
    --accent:#7F9BFF; --accent-ink:#0E151B; --ok:#4FBF88; --warn:#EDA13E; --bad:#F0705F;
    --wall:#3B4D5B; --crate:#D9994A; --v1:#6D7C87; --v2:#8B99A4; --v3:#556571; --v4:#7A8994;
    --plan-a:#7F9BFF; --plan-b:#EDA13E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E151B; --surface:#16212A; --sunken:#0A1015; --ink:#E7EEF3; --muted:#93A4B1; --rule:#2A3945;
  --accent:#7F9BFF; --accent-ink:#0E151B; --ok:#4FBF88; --warn:#EDA13E; --bad:#F0705F;
  --wall:#3B4D5B; --crate:#D9994A; --v1:#6D7C87; --v2:#8B99A4; --v3:#556571; --v4:#7A8994;
  --plan-a:#7F9BFF; --plan-b:#EDA13E; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-0.02em}
p{margin:0}
.mono{font-family:var(--mono)}
.tag{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:32px 20px 24px 28px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--rule)}
.brand{font:700 22px/1 var(--display);letter-spacing:-.02em}
.brand small{display:block;margin-top:6px;font:400 12px/1.3 var(--body);color:var(--muted);letter-spacing:0}
.route{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.route li{position:relative}
.route button{all:unset;box-sizing:border-box;display:block;width:100%;padding:7px 8px 7px 14px;cursor:pointer;border-radius:4px;font-size:15px;color:var(--muted)}
.route button:hover{color:var(--ink)}
.route button:focus-visible{outline:2px solid var(--accent)}
.route li::before{content:"";position:absolute;left:-21px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--ground);border:2px solid var(--rule)}
.route li.done::before{background:var(--ink);border-color:var(--ink)}
.route li.cur::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.route li.cur button{color:var(--ink);font-weight:600}
.route .group{padding:14px 0 4px 14px}
.route .sub button{padding-left:14px}
.route .sub .tag{display:block;margin-top:1px;font-size:10.5px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.45}

main{padding:40px clamp(16px,4vw,56px) 48px;max-width:1140px;width:100%}
.view{animation:in .22s ease-out}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{margin-bottom:10px}
h1{font-size:clamp(34px,5.2vw,58px);line-height:1.02;max-width:15ch}
h2{font-size:clamp(26px,3.4vw,38px);line-height:1.08}
.lede{margin-top:14px;font-size:18px;color:var(--muted);max-width:52ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;font-weight:600}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.small{padding:6px 12px;font-size:14px}

/* intro */
.flow{display:flex;flex-wrap:wrap;gap:0;margin:38px 0 34px;padding:0;list-style:none}
.flow li{position:relative;padding:14px 26px 14px 18px;background:var(--surface);border:1px solid var(--rule);margin-right:-1px;min-width:132px}
.flow li b{display:block;font:700 18px/1.1 var(--display)}
.flow li span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.flow li:first-child{border-radius:8px 0 0 8px}.flow li:last-child{border-radius:0 8px 8px 0}
.note{margin-top:26px;font-size:13.5px;color:var(--muted);max-width:60ch}

/* games */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:28px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--surface);border:1.5px solid var(--rule);border-radius:10px}
.tile:hover{border-color:var(--ink)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .thumb{background:var(--sunken);border-radius:6px;padding:10px;display:grid;place-items:center;height:190px}
.tile .thumb svg{max-height:170px;width:auto;max-width:100%}
.tile h3{font-size:22px}
.tile p{font-size:14.5px;color:var(--muted)}
.tile .risk{font-size:13.5px;color:var(--ink);padding-top:10px;border-top:1px dashed var(--rule)}

/* stage layout */
.stagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:22px}
.stagehead p{margin-top:8px;color:var(--muted);max-width:58ch}
.picked{font-size:14px;color:var(--muted)}
.picked button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.boardwrap{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px}
.boardwrap .stagebox{background:var(--sunken);border-radius:6px;padding:14px;display:grid;place-items:center;min-height:260px}
.boardwrap svg{width:100%;height:auto;max-height:420px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.controls input[type=range]{flex:1 1 120px;min-width:100px;accent-color:var(--accent)}
.status{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;min-height:28px}
.pill{font:500 12px/1 var(--mono);padding:5px 8px;border-radius:99px;border:1px solid var(--rule);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.panel{display:flex;flex-direction:column;gap:18px}
.panel h3{font-size:19px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 16px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ground)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;font:500 13px/1 var(--mono);padding:7px 9px;border-radius:5px;background:var(--surface);border:1px solid var(--rule)}
.chip.cur{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip.ok{border-color:var(--ok)}.chip.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.chip.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.chip.cur.warn,.chip.cur.bad{color:var(--ink)}
.verdict{padding:14px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--rule)}
.verdict.bad{border-left-color:var(--bad)}.verdict.warn{border-left-color:var(--warn)}.verdict.ok{border-left-color:var(--ok)}
.verdict b{display:block;margin-bottom:2px}
.verdict span{color:var(--muted);font-size:14.5px}
.graphcard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;overflow-x:auto}
.graphcard svg{display:block;min-width:520px;width:100%;height:auto}
.graphcard.compact svg{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.legend i{display:inline-block;width:20px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:16px;font-size:15px}
.facts b{font:700 22px/1 var(--display);margin-right:6px}
.solvers{display:grid;gap:12px}
.solver{padding:14px 16px;border:1.5px solid var(--rule);border-radius:8px;background:var(--surface)}
.solver.chosen{border-color:var(--accent)}
.solver header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.solver h3{font-size:18px}
.solver .sub{font-size:13px;color:var(--muted)}
.mark{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:4px}
.bar{height:10px;border-radius:5px;background:var(--sunken);margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--muted);border-radius:5px}
.solver.chosen .bar span{background:var(--accent)}
.solver .ms{margin-top:6px;font:500 13px/1 var(--mono);color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:15px}
.timeline li i{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--ok)}
.timeline li.bad i{background:var(--bad)}.timeline li.acc i{background:var(--accent)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--rule)}

/* board svg */
.b-wall{fill:var(--wall)}.b-floor{fill:var(--surface)}.b-goal{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:5 4}
.b-box rect{fill:var(--crate);stroke:var(--ink);stroke-width:2}
.b-box.on rect{fill:var(--ok)}
.b-player circle{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.mv{transition:transform .32s ease}
.b-veh rect{stroke:var(--ink);stroke-width:2}
.b-veh text{font:500 13px var(--mono);fill:var(--surface);pointer-events:none}
.b-grid{fill:var(--surface);stroke:var(--rule)}
.b-exit{fill:var(--ok)}
.b-bank{fill:var(--surface);stroke:var(--rule);stroke-width:2}.b-bank.danger{stroke:var(--bad);stroke-width:4;fill:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.b-river{fill:color-mix(in srgb,var(--accent) 22%,var(--sunken))}
.b-boat{fill:var(--ink)}
.b-m{fill:var(--accent);stroke:var(--ink);stroke-width:2}.b-c{fill:var(--crate);stroke:var(--ink);stroke-width:2}
.b-txt{font:500 12px var(--mono);fill:var(--ink)}
.b-label{font:500 13px var(--mono);fill:var(--muted)}
.g-edge{fill:none;stroke-width:2.5}
.g-node{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.g-goal{fill:var(--ok);stroke:var(--ink);stroke-width:2}
.g-stub{fill:var(--bad);stroke:var(--bad)}
.g-lab{font:500 11px var(--mono);fill:var(--muted)}

/* results */
.results{display:grid;gap:22px;margin-top:26px}
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px 32px;padding:22px 0;border-top:1px solid var(--rule)}
.res h3{font-size:22px}
.res .claim{margin-top:8px;color:var(--muted);max-width:40ch}
.rows{display:grid;gap:10px}
.rowbar{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.rowbar .bar{margin:0;height:14px}
.rowbar .v{font:500 13px var(--mono);color:var(--muted);text-align:right}
.rowbar .bar span.acc{background:var(--accent)}.rowbar .bar span.good{background:var(--ok)}.rowbar .bar span.bad{background:var(--bad)}
.duo{display:grid;gap:4px}
.limits{margin-top:8px;padding:20px 22px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.limits ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}
.forest{width:100%;height:auto}
.forest text{font:500 12px var(--mono);fill:var(--muted)}
.forest .nm{fill:var(--ink);font:500 13px var(--body)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;border-right:0;border-bottom:1px solid var(--rule);gap:10px 16px}
  .rail-foot,.route .tag,.route .group{display:none}
  .route{flex-direction:row;flex-wrap:wrap;border-left:0;padding:0;gap:4px}
  .route li::before{display:none}
  .route button{padding:6px 10px;border:1px solid var(--rule);border-radius:99px;font-size:13px}
  .route li.cur button{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .stage,.res{grid-template-columns:1fr}
  .rowbar{grid-template-columns:96px minmax(0,1fr) 78px}
}
@media (prefers-reduced-motion:reduce){.view{animation:none}.mv{transition:none}}
</style>

<div class="shell">
  <aside class="rail">

    <ol class="route" id="route"></ol>
    <div class="rail-foot">Every board, plan and number here comes from a live run of the project code.</div>
  </aside>
  <main id="main"></main>
</div>

const BOARDS = {sokoban: sokobanBoard, river: riverBoard, rush: rushBoard};

/* ---------- player: steps a board through frames ---------- */
function makePlayer(host, gid, frames, onFrame) {
  const board = BOARDS[gid](G[gid]);
  host.innerHTML = `<div class="stagebox"></div>
    <div class="controls">
      <button class="btn small" data-a="reset">Reset</button>
      <button class="btn small" data-a="back">Back</button>
      <button class="btn small primary" data-a="play">Play</button>
      <button class="btn small" data-a="next">Next</button>
      <input type="range" min="0" max="${frames.length - 1}" value="0" aria-label="Step">
    </div>
    <div class="status" aria-live="polite"></div>`;
  $(".stagebox", host).appendChild(board.svg);
  const range = $("input", host), status = $(".status", host), play = $('[data-a=play]', host);
  let i = 0, timer = null;
  const stop = () => { clearInterval(timer); timer = null; play.textContent = "Play"; };
  function go(n) {
    i = Math.max(0, Math.min(frames.length - 1, n));
    const f = frames[i];
    board.show(f.state, f.action);
    range.value = i;
    status.innerHTML = `<span class="pill">step ${i} of ${frames.length - 1}</span>` +
      `<span>${esc(f.label)}</span>` + (f.pill ? `<span class="pill ${f.tone || ""}">${esc(f.pill)}</span>` : "");
    if (onFrame) onFrame(i, f);
    if (i === frames.length - 1) stop();
  }
  if (host._h) host.removeEventListener("click", host._h);
  host._h = e => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (!a) return;
    if (a === "play") {
      if (timer) return stop();
      if (i === frames.length - 1) go(0);
      play.textContent = "Pause";
      timer = setInterval(() => go(i + 1), 720);
    } else { stop(); go(a === "reset" ? 0 : a === "back" ? i - 1 : i + 1); }
  };
  host.addEventListener("click", host._h);
  range.addEventListener("input", () => { stop(); go(+range.value); });
  go(0);
  return {go, stop, get index() { return i; }};
}

const chipsHtml = (steps, mode) => steps.map((s, i) => {
  const cls = mode === "check" ? (!s.ok ? "bad" : s.conf < 1 ? "warn" : "") : "";
  return `<button class="chip ${cls}" data-i="${i + 1}" title="Go to step ${i + 1}">${esc(s.a)}</button>`;
}).join("");
function bindChips(panel, player) {
  const mark = i => panel.querySelectorAll(".chip").forEach((c, k) => c.classList.toggle("cur", k + 1 === i));
  if (panel._h) panel.removeEventListener("click", panel._h);
  panel._h = e => { const c = e.target.closest(".chip"); if (c) { player.stop(); player.go(+c.dataset.i); } };
  panel.addEventListener("click", panel._h);
  return mark;
}
const framesFrom = (g, steps, tonef) => [{state: g.start, label: "Start"}].concat(steps.map((s, i) => {
  const t = tonef ? tonef(s) : {};
  return Object.assign({state: s.s, action: s.a, label: `Move ${s.a}`}, t);
}));

/* ---------- graph ---------- */
function graphSvg(g, mode) {
  const nodes = g.graph.nodes.filter(n => mode === "check" || !n.stub);
  const ids = new Set(nodes.map(n => n.id));
  const edges = g.graph.edges.filter(e => ids.has(e.s) && ids.has(e.t));
  const big = mode === "merge", W = big ? 900 : 540, H = big ? 300 : 200, pad = 28;
  const L = Math.max(1, ...nodes.map(n => n.layer));
  const byLayer = {};
  nodes.forEach(n => (byLayer[n.layer] = byLayer[n.layer] || []).push(n));
  const pos = {};
  Object.keys(byLayer).forEach(l => byLayer[l].forEach((n, k, arr) => {
    pos[n.id] = [pad + l * (W - 2 * pad) / L, arr.length === 1 ? H / 2 : pad + 10 + k * (H - 2 * pad - 20) / (arr.length - 1)];
  }));
  const col = e => e.plans.length > 1 ? "var(--muted)" : e.plans[0] === 0 ? "var(--plan-a)" : "var(--plan-b)";
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan graph">`;
  edges.forEach(e => {
    const [x1, y1] = pos[e.s], [x2, y2] = pos[e.t];
    let stroke = col(e), dash = "", extra = "";
    if (mode === "check") {
      if (e.st === "rejected") { stroke = "var(--bad)"; dash = ' stroke-dasharray="5 4"'; }
      else if (e.st === "uncertain") { stroke = "var(--warn)"; extra = ' stroke-width="4"'; }
      else stroke = "var(--ok)";
    }
    s += `<line class="g-edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}"${dash}${extra}/>`;
    if (big) s += `<text class="g-lab" x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 8}" text-anchor="middle">${esc(e.a)}</text>`;
  });
  nodes.forEach(n => {
    const [x, y] = pos[n.id], r = big ? 8 : 6;
    s += n.stub ? `<circle class="g-node g-stub" cx="${x}" cy="${y}" r="${r}"/>`
      : `<circle class="${n.goal ? "g-goal" : "g-node"}" cx="${x}" cy="${y}" r="${n.id === 0 || n.goal ? r + 3 : r}"/>`;
  });
  const p0 = pos[0];
  s += `<text class="g-lab" x="${p0[0]}" y="${p0[1] - 16}" text-anchor="middle">start</text>`;
  const goal = nodes.find(n => n.goal);
  if (goal) s += `<text class="g-lab" x="${pos[goal.id][0]}" y="${pos[goal.id][1] - 16}" text-anchor="middle">goal</text>`;
  return s + "</svg>";
}

  return stageShell("check", gid, "", `

function mountCheck(gid) {
  const g = G[gid];
  const k = g.bad_at + 1, kind = g.bad_kind;
  let mark;
  const verdictFor = on => {
    const s = g.bad_checked.steps[k - 1];
    if (!on) {
      if (kind === "uncertain") return ["warn", `Plan B runs to the end.`, `Nothing marks step ${k} as risky.`];
      return g.bad_plain.goal
        ? ["bad", "Plan B reaches the goal.", `It broke a rule at step ${k} and nothing noticed.`]
        : ["bad", "Plan B ends stuck.", `The goal is out of reach after step ${k}.`];
    }
    return kind === "rejected"
      ? ["ok", `Stopped at step ${k}.`, `${cap(s.why)}. The plan never enters the graph.`]
      : ["warn", `Step ${k} is kept, but trusted at ${s.conf.toFixed(2)}.`, `${cap(s.why)}. It costs more, so the solver avoids it.`];
  };
  const load = on => {
    if (player) player.stop();
    const steps = on ? g.bad_checked.steps : g.bad_plain.steps;
    $("#chips").innerHTML = chipsHtml(steps, on ? "check" : "plain");
    const v = verdictFor(on);
    $("#verdict").innerHTML = `<div class="verdict ${v[0]}"><b>${esc(v[1])}</b><span>${esc(v[2])}</span></div>`;
    document.querySelectorAll("[data-chk]").forEach(b => b.setAttribute("aria-pressed", b.dataset.chk == (on ? 1 : 0)));
    const tonef = s => on && !s.ok ? {tone: "bad", pill: "rejected"} : on && s.conf < 1 ? {tone: "warn", pill: `trust ${s.conf.toFixed(2)}`} : {};
    player = makePlayer($("#left"), gid, framesFrom(g, steps, tonef), i => mark && mark(i));
    mark = bindChips($("#right"), player);
    mark(0);
    player.go(Math.min(k, steps.length));
    player.stop();
    mark(player.index);
  };
  $("#right").addEventListener("click", e => { const b = e.target.closest("[data-chk]"); if (b) load(b.dataset.chk === "1"); });
  load(true);
}

function viewChoose(gid) {

function viewRun(gid) {
  const g = G[gid], r = g.run;
  return stageShell("run", gid, "", `

      <li class="acc"><i></i><span>Plan again from the real state with ${r.method === "astar" ? "A*" : "CP-SAT"}. ${r.after_actions.length} moves to go.</span></li>
    </ul>

function mountRun(gid) {
  const g = G[gid], r = g.run;
  const before = r.before_actions.map((a, i) => ({a, s: r.before[i], ok: true, conf: 1, phase: "run"}));
  const slip = {a: r.slipped_action + " (slip)", s: r.real, ok: false, conf: 1};
  const after = r.after_actions.map((a, i) => ({a, s: r.after[i], ok: true, conf: 1}));
  const all = before.concat([slip], after);
  const frames = [{state: g.start, label: "Start"}].concat(all.map((s, i) => {
    const kind = i < before.length ? "run" : i === before.length ? "slip" : "replan";
    return {state: s.s, action: s.a, label: kind === "slip" ? `${r.slipped_action} did not happen` : `Move ${s.a}`,
      tone: kind === "slip" ? "bad" : kind === "replan" ? "ok" : "", pill: kind === "slip" ? "slip" : kind === "replan" ? "replanned" : ""};
  }));
  $("#chips").innerHTML = all.map((s, i) => `<button class="chip ${i === before.length ? "bad" : ""}" data-i="${i + 1}">${esc(s.a)}</button>`).join("");
  let mark;
  player = makePlayer($("#left"), gid, frames, i => mark && mark(i));
  mark = bindChips($("#right"), player); mark(0);
}

/* ---------- routing ---------- */
const ORDER = ["intro", "games"].concat(STAGES.map(s => s.id), ["results"]);
const cur = () => state.screen === "stage" ? state.stage : state.screen;
function hashFor() { return state.screen === "stage" ? `${state.game}-${state.stage}` : state.screen; }
function fromHash() {
  const h = location.hash.slice(1), [g, s] = h.split("-");
  if (G[g] && STAGES.some(x => x.id === s)) { state.game = g; state.screen = "stage"; state.stage = s; }
  else if (h === "games" || h === "results") state.screen = h;
  else state.screen = "intro";
}
function goto(id) {
  if (STAGES.some(s => s.id === id)) { if (!state.game) return goto("games"); state.screen = "stage"; state.stage = id; }
  else state.screen = id;
  if (location.hash.slice(1) !== hashFor()) location.hash = hashFor();
  render();
}

function renderRoute() {
  const c = cur(), ci = ORDER.indexOf(c);
  const li = (id, label, cls = "", tag = "") => `<li class="${ORDER.indexOf(id) < ci ? "done" : ""} ${id === c ? "cur" : ""} ${cls}"><button data-goto="${id}">${label}${tag ? `<span class="tag">${tag}</span>` : ""}</button></li>`;
  $("#route").innerHTML = li("intro", "Start") + li("games", state.game ? `Game: ${META[state.game].name}` : "Pick a game") +
    `<li class="group tag">Pipeline</li>` + STAGES.map(s => li(s.id, s.name, "sub", s.phase)).join("") + li("results", "Results");
}

function render() {
  if (player) { player.stop(); player = null; }
  renderRoute();
  const main = $("#main"), c = cur(), gid = state.game;
  const views = {intro: viewIntro, games: viewGames, results: viewResults};
  let html;
  if (views[c]) html = `<div class="view">${views[c]()}</div>`.replace('<div class="view"><div class="view">', '<div class="view">');
  else html = {propose: viewPropose, merge: viewMerge, check: viewCheck, choose: viewChoose, run: viewRun}[c](gid);
  const i = ORDER.indexOf(c), prev = ORDER[i - 1], next = ORDER[i + 1];
  const canNext = next && !(c === "games" && !gid);
  main.innerHTML = html + (c === "intro" || c === "games" ? "" : `<div class="pager">
    <button class="btn" data-goto="${prev}" ${prev ? "" : "disabled"}>Back</button>
    ${next ? `<button class="btn primary" data-goto="${next}">${next === "results" ? "See results" : "Next: " + STAGES.find(s => s.id === next).name}</button>` : "<span></span>"}</div>`);
  if (c === "games") document.querySelectorAll("[data-thumb]").forEach(t => { const b = BOARDS[t.dataset.thumb](G[t.dataset.thumb]); b.show(G[t.dataset.thumb].start); t.appendChild(b.svg); });
  if (c === "propose") mountPropose(gid);
  if (c === "check") mountCheck(gid);
  if (c === "choose") mountChoose(gid);
  if (c === "run") mountRun(gid);
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-goto],[data-go],[data-game]");
  if (!t) return;
  if (t.dataset.game) { state.game = t.dataset.game; goto("propose"); }
  else goto(t.dataset.goto || t.dataset.go);
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.altKey || e.ctrlKey || e.metaKey) return;
  const c = cur(), i = ORDER.indexOf(c);
  if (e.key === "ArrowRight" && ORDER[i + 1] && !(c === "games" && !state.game)) goto(ORDER[i + 1]);
  if (e.key === "ArrowLeft" && ORDER[i - 1]) goto(ORDER[i - 1]);
});
window.addEventListener("hashchange", () => { if (location.hash.slice(1) !== hashFor()) { fromHash(); render(); } });
fromHash();
render();
</script>
