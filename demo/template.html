<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#E8EDED; --surface:#F6F8F8; --sunken:#DAE3E3; --ink:#10201F; --muted:#506464; --rule:#C2CFCF;
  --accent:#0A6B7D; --accent-ink:#FFFFFF; --ok:#2A7F4F; --warn:#C9770F; --bad:#C63A2B;
  --wall:#26393B; --crate:#C9822F; --v1:#7E9091; --v2:#A2B2B3; --v3:#607274; --v4:#94A5A6;
  --plan-a:#0A6B7D; --plan-b:#C9770F;
  --display:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1617; --surface:#152223; --sunken:#091112; --ink:#E4EEEE; --muted:#8FA6A6; --rule:#263838;
    --accent:#54C6D6; --accent-ink:#08181A; --ok:#5CC48A; --warn:#EDA13E; --bad:#F0705F;
    --wall:#3A5254; --crate:#D9994A; --v1:#6C8082; --v2:#8A9C9E; --v3:#55686A; --v4:#7B8E90;
    --plan-a:#54C6D6; --plan-b:#EDA13E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1617; --surface:#152223; --sunken:#091112; --ink:#E4EEEE; --muted:#8FA6A6; --rule:#263838;
  --accent:#54C6D6; --accent-ink:#08181A; --ok:#5CC48A; --warn:#EDA13E; --bad:#F0705F;
  --wall:#3A5254; --crate:#D9994A; --v1:#6C8082; --v2:#8A9C9E; --v3:#55686A; --v4:#7B8E90;
  --plan-a:#54C6D6; --plan-b:#EDA13E; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-0.015em}
p{margin:0}
.mono{font-family:var(--mono)}
.tag{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* header and tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1200px;margin:0 auto;padding:12px clamp(16px,4vw,40px) 0;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:28px;align-items:end}
.brand{font:700 20px/1 var(--display);letter-spacing:-.01em;padding-bottom:12px}
.brand small{display:block;margin-top:5px;font:400 12px/1.3 var(--body);color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;grid-column:1/-1;order:3}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 14px 11px;font-weight:500;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.theme{padding-bottom:10px}
.theme .seg button{padding:6px 12px;font-size:13px}
main{padding:40px clamp(16px,4vw,56px) 48px;max-width:1140px;width:100%}
.view{animation:in .22s ease-out}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{margin-bottom:10px}
h1{font-size:clamp(34px,5.2vw,58px);line-height:1.02;max-width:15ch}
h2{font-size:clamp(26px,3.4vw,38px);line-height:1.08}
.lede{margin-top:14px;font-size:18px;color:var(--muted);max-width:52ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;font-weight:600}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.small{padding:6px 12px;font-size:14px}

/* intro */
.map{margin-top:48px;padding-top:28px;border-top:1px solid var(--rule)}
.map h2{font-size:clamp(22px,2.6vw,30px)}
.nodes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px;margin-top:18px}
.node{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:14px;min-height:118px;background:var(--surface);border:1.5px solid var(--rule);border-radius:8px}
.node b{font:700 17px/1.15 var(--display)}
.node span:last-child{font-size:13.5px;color:var(--muted)}
.node:hover{border-color:var(--ink)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.node[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.node:not(:last-child)::after{content:"";position:absolute;right:-17px;top:50%;width:12px;height:12px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:translateY(-50%) rotate(45deg) scale(.7)}
.node:nth-last-child(2)::after{display:none}
.node.side{border-style:dashed}
.detail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 32px;align-items:start;margin-top:18px;padding:20px 22px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.detail h3{font-size:20px}
.detail ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;max-width:64ch}
@media (max-width:1100px){.nodes{grid-template-columns:repeat(3,minmax(0,1fr))}.node:not(:last-child)::after{display:none}}
@media (max-width:560px){.nodes{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}}
.note{margin-top:26px;font-size:13.5px;color:var(--muted);max-width:60ch}

/* games */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:28px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--surface);border:1.5px solid var(--rule);border-radius:10px}
.tile:hover{border-color:var(--ink)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .thumb{background:var(--sunken);border-radius:6px;padding:10px;display:grid;place-items:center;height:190px}
.tile .thumb svg{max-height:170px;width:auto;max-width:100%}
.tile h3{font-size:22px}
.tile p{font-size:14.5px;color:var(--muted)}
.tile .risk{font-size:13.5px;color:var(--ink);padding-top:10px;border-top:1px dashed var(--rule)}

/* stage layout */
.stagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:22px}
.stagehead p{margin-top:8px;color:var(--muted);max-width:58ch}
.picked{font-size:14px;color:var(--muted)}
.picked button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.boardwrap{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px}
.boardwrap .stagebox{background:var(--sunken);border-radius:6px;padding:14px;display:grid;place-items:center;min-height:260px}
.boardwrap svg{width:100%;height:auto;max-height:420px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.controls input[type=range]{flex:1 1 120px;min-width:100px;accent-color:var(--accent)}
.status{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;min-height:28px}
.pill{font:500 12px/1 var(--mono);padding:5px 8px;border-radius:99px;border:1px solid var(--rule);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.panel{display:flex;flex-direction:column;gap:18px}
.panel h3{font-size:19px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 16px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ground)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;font:500 13px/1 var(--mono);padding:7px 9px;border-radius:5px;background:var(--surface);border:1px solid var(--rule)}
.chip.cur{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip.ok{border-color:var(--ok)}.chip.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.chip.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.chip.cur.warn,.chip.cur.bad{color:var(--ink)}
.verdict{padding:14px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--rule)}
.verdict.bad{border-left-color:var(--bad)}.verdict.warn{border-left-color:var(--warn)}.verdict.ok{border-left-color:var(--ok)}
.verdict b{display:block;margin-bottom:2px}
.verdict span{color:var(--muted);font-size:14.5px}
.graphcard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;overflow-x:auto}
.graphcard svg{display:block;min-width:520px;width:100%;height:auto}
.graphcard.compact svg{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.legend i{display:inline-block;width:20px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:16px;font-size:15px}
.facts b{font:700 22px/1 var(--display);margin-right:6px}
.solvers{display:grid;gap:12px}
.solver{padding:14px 16px;border:1.5px solid var(--rule);border-radius:8px;background:var(--surface)}
.solver.chosen{border-color:var(--accent)}
.solver header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.solver h3{font-size:18px}
.solver .sub{font-size:13px;color:var(--muted)}
.mark{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:4px}
.bar{height:10px;border-radius:5px;background:var(--sunken);margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--muted);border-radius:5px}
.solver.chosen .bar span{background:var(--accent)}
.solver .ms{margin-top:6px;font:500 13px/1 var(--mono);color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:15px}
.timeline li i{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--ok)}
.timeline li.bad i{background:var(--bad)}.timeline li.acc i{background:var(--accent)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--rule)}

/* board svg */
.b-wall{fill:var(--wall)}.b-floor{fill:var(--surface)}.b-goal{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:5 4}
.b-box rect{fill:var(--crate);stroke:var(--ink);stroke-width:2}
.b-box.on rect{fill:var(--ok)}
.b-player circle{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.mv{transition:transform .32s ease}
.b-veh rect{stroke:var(--ink);stroke-width:2}
.b-veh text{font:500 13px var(--mono);fill:var(--surface);pointer-events:none}
.b-grid{fill:var(--surface);stroke:var(--rule)}
.b-exit{fill:var(--ok)}
.b-bank{fill:var(--surface);stroke:var(--rule);stroke-width:2}.b-bank.danger{stroke:var(--bad);stroke-width:4;fill:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.b-river{fill:color-mix(in srgb,var(--accent) 22%,var(--sunken))}
.b-boat{fill:var(--ink)}
.b-m{fill:var(--accent);stroke:var(--ink);stroke-width:2}.b-c{fill:var(--crate);stroke:var(--ink);stroke-width:2}
.b-txt{font:500 12px var(--mono);fill:var(--ink)}
.b-label{font:500 13px var(--mono);fill:var(--muted)}
.g-edge{fill:none;stroke-width:2.5}
.g-node{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.g-goal{fill:var(--ok);stroke:var(--ink);stroke-width:2}
.g-stub{fill:var(--bad);stroke:var(--bad)}
.g-lab{font:500 11px var(--mono);fill:var(--muted)}

/* results */
.results{display:grid;gap:22px;margin-top:26px}
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px 32px;padding:22px 0;border-top:1px solid var(--rule)}
.res h3{font-size:22px}
.res .claim{margin-top:8px;color:var(--muted);max-width:40ch}
.rows{display:grid;gap:10px}
.rowbar{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.rowbar .bar{margin:0;height:14px}
.rowbar .v{font:500 13px var(--mono);color:var(--muted);text-align:right}
.rowbar .bar span.acc{background:var(--accent)}.rowbar .bar span.good{background:var(--ok)}.rowbar .bar span.bad{background:var(--bad)}
.duo{display:grid;gap:4px}
.limits{margin-top:8px;padding:20px 22px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.limits ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}
.forest{width:100%;height:auto}
.forest text{font:500 12px var(--mono);fill:var(--muted)}
.forest .nm{fill:var(--ink);font:500 13px var(--body)}


.b-hole{fill:var(--sunken);stroke:var(--rule);stroke-width:2}
.b-peg{fill:var(--crate);stroke:var(--ink);stroke-width:2;transition:opacity .25s,transform .25s;transform-box:fill-box;transform-origin:center}
.b-peg.off{opacity:0;transform:scale(.4)}
.b-tile rect{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.b-tile.home rect{fill:color-mix(in srgb,var(--accent) 30%,var(--surface))}
.b-tile text{font:600 22px var(--display);fill:var(--ink)}
.b-sticker{stroke:var(--ink);stroke-width:1.5}
/* pages */
main{margin:0 auto;max-width:1200px;padding:36px clamp(16px,4vw,40px) 40px;width:100%}
.page-head .lede{max-width:64ch}
.gfacts{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:16px;font-size:14.5px;color:var(--muted)}
.gfacts b{color:var(--ink);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:26px 0 26px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.step{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:3px;min-width:0}
.step:last-child{border-right:0}
.step b{font-weight:600;font-size:15px}
.step span{font:500 11px/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.step:hover{background:var(--sunken)}
.step[aria-selected=true]{background:var(--ink);color:var(--ground)}
.step[aria-selected=true] span{color:inherit;opacity:.8}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.stitle{font-size:24px}
.sec{margin-top:44px;padding-top:26px;border-top:1px solid var(--rule)}
.sec h2{font-size:clamp(22px,2.6vw,30px)}
.tbl{overflow-x:auto;margin-top:16px}
.phases{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.phases th{text-align:left;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1.5px solid var(--ink)}
.phases td{padding:11px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.phases td:first-child{white-space:nowrap;font-weight:600}
.state{font:500 12px/1 var(--mono);color:var(--ok);white-space:nowrap}
.link{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmpc{padding:14px 16px;border:1.5px solid var(--rule);border-radius:8px;background:var(--surface)}
.cmpc.win{border-color:var(--ok)}.cmpc.lose{border-color:var(--bad)}
.cmpc .big{font:700 24px/1.15 var(--display);margin:8px 0 2px}
.cmpc .sub{font-size:13.5px;color:var(--muted)}
.foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
@media (max-width:900px){
  .stage,.res{grid-template-columns:1fr}
  .rowbar{grid-template-columns:96px minmax(0,1fr) 78px}
  .steps{grid-template-columns:repeat(5,minmax(120px,1fr));overflow-x:auto}
}
@media (max-width:560px){.cmp{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.mv{transition:none}}
</style>

<header class="top"><div class="top-in">
  <div class="brand">Plan Check<small>A checking layer for planners, built on TAPE</small></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <div class="theme"><div class="seg" role="group" aria-label="Theme">
    <button data-theme-set="light" aria-pressed="false">Light</button><button data-theme-set="dark" aria-pressed="false">Dark</button></div></div>
</div></header>
<main id="main"></main>

<script>
const D = __DEMO_DATA_JSON__;
const G = D.games;
const GAMES = ["sokoban", "river", "rush", "peg", "puzzle", "cube"];
const META = {
  sokoban: {name: "Sokoban", goal: "Push the box onto the target.", risk: "Push it into a corner and it is stuck for good.", checker: "dead corner rule"},
  river: {name: "River Crossing", goal: "Ferry 3 missionaries and 3 cannibals across in a 2 seat boat.", risk: "If cannibals outnumber missionaries on a bank, the game is lost.", checker: "outnumbered rule"},
  rush: {name: "Rush Hour", goal: "Slide the blue car out through the exit.", risk: "Cars block each other, and some jams are easy to miss.", checker: "gridlock rule"},
  peg: {name: "Peg Solitaire", goal: "Jump pegs over each other until one is left, in the centre hole.", risk: "Most lines of play end stuck with pegs scattered, and some positions are lost long before that.", checker: "pagoda bound"},
  puzzle: {name: "24-Puzzle", goal: "Slide 24 numbered tiles into order.", risk: "Half of all arrangements can never be solved, and a search cannot tell.", checker: "parity rule"},
  cube: {name: "Rubik's Cube", goal: "Twist the cube until every face is one colour.", risk: "A cube rebuilt wrongly can be impossible to solve, and a search cannot tell.", checker: "invariant rules"},
  boxoban: {name: "Boxoban", goal: "Solve real 10 by 10 levels with four boxes.", risk: "Public levels we did not write. Dead corners waste the search."}
};
const TABS = [
  {id: "overview", label: "Overview"}, {id: "sokoban", label: "Sokoban"}, {id: "river", label: "River Crossing"},
  {id: "rush", label: "Rush Hour"}, {id: "boxoban", label: "Boxoban"}, {id: "peg", label: "Peg Solitaire"},
  {id: "puzzle", label: "24-Puzzle"}, {id: "cube", label: "Rubik's Cube"}, {id: "results", label: "Results"}
];
const STAGES = [
  {id: "propose", name: "Propose", phase: "Phase 1", title: "Propose", text: "The planner suggests several plans. Play both."},
  {id: "merge", name: "Merge", phase: "Phase 1", title: "Merge", text: "Plans that reach the same state share a node. Together they form one graph."},
  {id: "check", name: "Check", phase: "Phases 2 and 3", title: "Check", text: "A rule checker looks at every move. Switch it on and off."},
  {id: "choose", name: "Choose", phase: "Phases 4 and 5", title: "Choose", text: "Each move gets a cost. A solver finds the cheapest path to the goal."},
  {id: "run", name: "Run", phase: "Phases 1 and 3", title: "Run", text: "Worlds surprise us. When a move slips, plan again from where we really are."}
];
const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const svgEl = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};

/* ---------- boards: each returns {svg, show(state, action)} ---------- */
function sokobanBoard(g) {
  const S = g.static, C = 44;
  const svg = svgEl("svg", {viewBox: `0 0 ${S.w * C} ${S.h * C}`, role: "img", "aria-label": "Sokoban board"});
  svgEl("rect", {width: S.w * C, height: S.h * C, class: "b-floor"}, svg);
  S.walls.forEach(([r, c]) => svgEl("rect", {x: c * C, y: r * C, width: C, height: C, class: "b-wall"}, svg));
  S.goals.forEach(([r, c]) => svgEl("circle", {cx: c * C + C / 2, cy: r * C + C / 2, r: C * .32, class: "b-goal"}, svg));
  const goalSet = new Set(S.goals.map(String));
  let boxes = [];
  const player = svgEl("g", {class: "b-player mv"}, svg);
  svgEl("circle", {cx: C / 2, cy: C / 2, r: C * .3}, player);
  const at = (el, r, c) => { el.style.transform = `translate(${c * C}px,${r * C}px)`; };
  function show(st) {
    at(player, st.p[0], st.p[1]);
    const next = st.b.slice(), used = new Set(), pairs = [];
    boxes.forEach(b => {
      let bestI = -1, bestD = 1e9;
      next.forEach((n, i) => { if (used.has(i)) return; const d = Math.abs(n[0] - b.pos[0]) + Math.abs(n[1] - b.pos[1]); if (d < bestD) { bestD = d; bestI = i; } });
      if (bestI >= 0) { used.add(bestI); pairs.push([b, next[bestI]]); }
    });
    next.forEach((n, i) => {
      if (used.has(i)) return;
      const el = svgEl("g", {class: "b-box mv"}, svg);
      svgEl("rect", {x: 5, y: 5, width: C - 10, height: C - 10, rx: 4}, el);
      const b = {el, pos: n}; boxes.push(b); pairs.push([b, n]);
    });
    pairs.forEach(([b, n]) => { b.pos = n; at(b.el, n[0], n[1]); b.el.classList.toggle("on", goalSet.has(String(n))); });
    svg.appendChild(player);
  }
  return {svg, show};
}

function makePlayer(host, gid, frames, onFrame) {
  const board = gid === "boxoban" ? sokobanBoard(D.boxoban) : BOARDS[gid](G[gid]);
  host.innerHTML = `<div class="stagebox"></div>

    </div>
    <div class="status" aria-live="polite"></div>`;
  $(".stagebox", host).appendChild(board.svg);
  if (frames.length < 2) $(".controls", host).hidden = true;
  const range = $("input", host), status = $(".status", host), play = $('[data-a=play]', host);
  let i = 0, timer = null;
  const stop = () => { clearInterval(timer); timer = null; play.textContent = "Play"; };
  function go(n) {
    i = Math.max(0, Math.min(frames.length - 1, n));
    const f = frames[i];
    board.show(f.state, f.action);
    range.value = i;
    status.innerHTML = (frames.length > 1 ? `<span class="pill">step ${i} of ${frames.length - 1}</span>` : "") +
      `<span>${esc(f.label)}</span>` + (f.pill ? `<span class="pill ${f.tone || ""}">${esc(f.pill)}</span>` : "");
    if (onFrame) onFrame(i, f);
    if (i === frames.length - 1) stop();
  }
  if (host._h) host.removeEventListener("click", host._h);
  host._h = e => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (!a) return;
    if (a === "play") {
      if (timer) return stop();
      if (i === frames.length - 1) go(0);

      timer = setInterval(() => go(i + 1), 720);

  };

  return {go, stop, get index() { return i; }};
}

/* ---------- graph ---------- */
function graphSvg(g, mode) {
  const nodes = g.graph.nodes.filter(n => mode === "check" || !n.stub);
  const ids = new Set(nodes.map(n => n.id));
  const edges = g.graph.edges.filter(e => ids.has(e.s) && ids.has(e.t));
  const big = mode === "merge", W = big ? 900 : 540, H = big ? 300 : 200, pad = 28;
  const L = Math.max(1, ...nodes.map(n => n.layer));
  const byLayer = {};
  nodes.forEach(n => (byLayer[n.layer] = byLayer[n.layer] || []).push(n));
  const pos = {};
  Object.keys(byLayer).forEach(l => byLayer[l].forEach((n, k, arr) => {
    pos[n.id] = [pad + l * (W - 2 * pad) / L, arr.length === 1 ? H / 2 : pad + 10 + k * (H - 2 * pad - 20) / (arr.length - 1)];
  }));
  const col = e => e.plans.length > 1 ? "var(--muted)" : e.plans[0] === 0 ? "var(--plan-a)" : "var(--plan-b)";
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan graph">`;
  edges.forEach(e => {
    const [x1, y1] = pos[e.s], [x2, y2] = pos[e.t];
    let stroke = col(e), dash = "", extra = "";
    if (mode === "check") {
      if (e.st === "rejected") { stroke = "var(--bad)"; dash = ' stroke-dasharray="5 4"'; }
      else if (e.st === "uncertain") { stroke = "var(--warn)"; extra = ' stroke-width="4"'; }
      else stroke = "var(--ok)";
    }
    s += `<line class="g-edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}"${dash}${extra}/>`;
    if (big) s += `<text class="g-lab" x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 8}" text-anchor="middle">${esc(e.a)}</text>`;
  });
  nodes.forEach(n => {
    const [x, y] = pos[n.id], r = big ? 8 : 6;
    s += n.stub ? `<circle class="g-node g-stub" cx="${x}" cy="${y}" r="${r}"/>`
      : `<circle class="${n.goal ? "g-goal" : "g-node"}" cx="${x}" cy="${y}" r="${n.id === 0 || n.goal ? r + 3 : r}"/>`;
  });
  const p0 = pos[0];
  s += `<text class="g-lab" x="${p0[0]}" y="${p0[1] - 16}" text-anchor="middle">start</text>`;
  const goal = nodes.find(n => n.goal);
  if (goal) s += `<text class="g-lab" x="${pos[goal.id][0]}" y="${pos[goal.id][1] - 16}" text-anchor="middle">goal</text>`;
  return s + "</svg>";
}

    $("#pinfo").textContent = `${plans[k].length} moves`;
    document.querySelectorAll("[data-plan]").forEach(b => b.setAttribute("aria-pressed", b.dataset.plan == k));
    player = makePlayer($("#left"), gid, framesFrom(g, plans[k]), i => mark && mark(i));
    mark = bindChips($("#right"), player);
    mark(0);
  };
  $("#right").addEventListener("click", e => { const b = e.target.closest("[data-plan]"); if (b) load(+b.dataset.plan); });
  load(0);
}

function viewMerge(gid) {
  const g = G[gid];
  return `<div class="view">${head("merge", gid)}
    <div class="graphcard">${graphSvg(g, "merge")}</div>
    <div class="legend"><span><i style="border-color:var(--plan-a)"></i>only Plan A</span><span><i style="border-color:var(--plan-b)"></i>only Plan B</span><span><i style="border-color:var(--muted)"></i>both plans</span></div>
    <div class="facts"><span><b>${g.graph_stats.nodes}</b>states</span><span><b>${g.graph_stats.edges}</b>moves</span></div></div>`;
}

const BROKEN = {puzzle: "Two tiles are swapped on the board. This arrangement can never be solved.", cube: "One corner is twisted on the board. This cube can never be solved."};
function viewCheck(gid) {
  const n = v => v.toLocaleString("en-US"), gate = G[gid].gate;
  if (G[gid].bad_kind === "static") return stageShell("check", gid, "", `
    <div class="verdict ok"><b>Every move in both plans passes.</b><span>Legal moves never break the ${META[gid].checker}, so there is nothing to reject mid-plan.</span></div>
    <div><div class="tag" style="margin-bottom:8px">Where it does work: a start that cannot be solved</div>
      <div class="cmp">
        <div class="cmpc lose"><span class="tag">No checker</span><div class="big">${n(gate.plain)} nodes</div><div class="sub">The search used its whole budget and found nothing.</div></div>
        <div class="cmpc win"><span class="tag">With checker</span><div class="big">${n(gate.gated)} nodes</div><div class="sub">Every first move is rejected, so it stops at once.</div></div>
      </div></div>
    <p class="picked">${BROKEN[gid]}</p>`);
  return stageShell("check", gid, "", `
    <div><div class="tag" style="margin-bottom:8px">Rule checker</div>
    <div class="seg" role="group" aria-label="Rule checker"><button data-chk="0" aria-pressed="false">Off</button><button data-chk="1" aria-pressed="true">On</button></div></div>
    <div><h3>Plan B</h3></div>
    <div class="chips" id="chips"></div>
    <div id="verdict"></div>
    <div><div class="tag" style="margin-bottom:6px">Graph after checking</div><div class="graphcard compact" style="padding:8px">${graphSvg(G[gid], "check")}</div>
    <div class="legend"><span><i style="border-color:var(--ok)"></i>accepted</span><span><i style="border-color:var(--warn)"></i>doubtful</span><span><i style="border-color:var(--bad);border-top-style:dashed"></i>rejected</span></div></div>`);
}
function mountCheck(gid) {
  const g = G[gid];
  if (g.bad_kind === "static") {
    player = makePlayer($("#left"), gid, [{state: g.gate.start, label: "Unsolvable start"}]);
    return;
  }
  const k = g.bad_at + 1, kind = g.bad_kind;
  let mark;
  const verdictFor = on => {
    const s = g.bad_checked.steps[k - 1];
    if (!on) {
      if (kind === "uncertain") return ["warn", `Plan B runs to the end.`, `Nothing marks step ${k} as risky.`];
      return g.bad_plain.goal
        ? ["bad", "Plan B reaches the goal.", `It broke a rule at step ${k} and nothing noticed.`]
        : ["bad", "Plan B ends stuck.", `The goal is out of reach after step ${k}.`];
    }
    return kind === "rejected"
      ? ["ok", `Stopped at step ${k}.`, `${cap(s.why)}. The plan never enters the graph.`]
      : ["warn", `Step ${k} is kept, but trusted at ${s.conf.toFixed(2)}.`, `${cap(s.why)}. It costs more, so the solver avoids it.`];
  };
  const load = on => {
    if (player) player.stop();
    const steps = on ? g.bad_checked.steps : g.bad_plain.steps;
    $("#chips").innerHTML = chipsHtml(steps, on ? "check" : "plain");
    const v = verdictFor(on);
    $("#verdict").innerHTML = `<div class="verdict ${v[0]}"><b>${esc(v[1])}</b><span>${esc(v[2])}</span></div>`;
    document.querySelectorAll("[data-chk]").forEach(b => b.setAttribute("aria-pressed", b.dataset.chk == (on ? 1 : 0)));
    const tonef = s => on && !s.ok ? {tone: "bad", pill: "rejected"} : on && s.conf < 1 ? {tone: "warn", pill: `trust ${s.conf.toFixed(2)}`} : {};
    player = makePlayer($("#left"), gid, framesFrom(g, steps, tonef), i => mark && mark(i));
    mark = bindChips($("#right"), player);
    mark(0);
    player.go(Math.min(k, steps.length));
    player.stop();
    mark(player.index);
  };
  $("#right").addEventListener("click", e => { const b = e.target.closest("[data-chk]"); if (b) load(b.dataset.chk === "1"); });
  load(true);
}

function viewChoose(gid) {
  const g = G[gid], c = g.choose, max = Math.max(c.astar_ms, c.cpsat_ms);
  const card = (id, name, sub, ms) => `<div class="solver ${c.method === id ? "chosen" : ""}">
    <header><div><h3>${name}</h3><div class="sub">${sub}</div></div>${c.method === id ? '<span class="mark">chosen</span>' : ""}</header>
    <div class="bar"><span style="width:${Math.max(2, ms / max * 100)}%"></span></div><div class="ms">${ms.toFixed(2)} ms on this graph</div></div>`;
  return stageShell("choose", gid, "", `
    <div class="solvers">${card("astar", "A*", "Best-first search", c.astar_ms)}${card("cp_sat", "CP-SAT", "Constraint solver", c.cpsat_ms)}</div>
    <div class="verdict ok"><b>${c.method === "astar" ? "One moving piece. A search is enough." : "Several pieces block each other. The solver plans them together."}</b>
    <span>${g.piece} here. Path cost ${c.cost} over ${c.length} moves.</span></div>
    <div class="chips" id="chips"></div>`);
}
function mountChoose(gid) {
  const g = G[gid], c = g.choose;
  const steps = c.actions.map((a, i) => ({a, s: c.states[i], ok: true, conf: 1}));
  $("#chips").innerHTML = chipsHtml(steps, "plain");
  let mark;
  player = makePlayer($("#left"), gid, framesFrom(g, steps), i => mark && mark(i));
  mark = bindChips($("#right"), player); mark(0);
}

function viewRun(gid) {
  const g = G[gid], r = g.run;
  return stageShell("run", gid, "", `
    <ul class="timeline">
      <li class="acc"><i></i><span>Follow the chosen path for ${r.slip_at} moves.</span></li>
      <li class="bad"><i></i><span>Move <b class="mono">${esc(r.slipped_action)}</b> slips. The world did not change.</span></li>
      <li class="acc"><i></i><span>Plan again from the real state with ${r.method === "astar" ? "A*" : "CP-SAT"}. ${r.after_actions.length} moves to go.</span></li>
    </ul>
    <div class="verdict ok"><b>The slip is remembered.</b><span>Trust in that move drops from 1.00 to ${r.memory_conf.toFixed(2)}, so later plans lean away from it.</span></div>
    <div class="chips" id="chips"></div>`);
}
function mountRun(gid) {
  const g = G[gid], r = g.run;
  const before = r.before_actions.map((a, i) => ({a, s: r.before[i], ok: true, conf: 1, phase: "run"}));
  const slip = {a: r.slipped_action + " (slip)", s: r.real, ok: false, conf: 1};
  const after = r.after_actions.map((a, i) => ({a, s: r.after[i], ok: true, conf: 1}));
  const all = before.concat([slip], after);
  const frames = [{state: g.start, label: "Start"}].concat(all.map((s, i) => {
    const kind = i < before.length ? "run" : i === before.length ? "slip" : "replan";
    return {state: s.s, action: s.a, label: kind === "slip" ? `${r.slipped_action} did not happen` : `Move ${s.a}`,
      tone: kind === "slip" ? "bad" : kind === "replan" ? "ok" : "", pill: kind === "slip" ? "slip" : kind === "replan" ? "replanned" : ""};
  }));
  $("#chips").innerHTML = all.map((s, i) => `<button class="chip ${i === before.length ? "bad" : ""}" data-i="${i + 1}">${esc(s.a)}</button>`).join("");
  let mark;
  player = makePlayer($("#left"), gid, frames, i => mark && mark(i));
  mark = bindChips($("#right"), player); mark(0);
}

function boxRows(i) {
  return D.results.boxoban[i].rows.map(x => `<div class="duo"><span style="font-size:14px">${x.budget} nodes per search</span>
    <div class="rowbar" style="grid-template-columns:70px minmax(0,1fr) 76px"><span class="picked">no pruning</span><div class="bar"><span style="width:${x.plain}%"></span></div><span class="v">${x.plain}%</span></div>
    <div class="rowbar" style="grid-template-columns:70px minmax(0,1fr) 76px"><span class="picked">with checker</span><div class="bar"><span class="acc" style="width:${x.prune}%"></span></div><span class="v">${x.prune}%</span></div></div>`).join("");
}

function viewBoxoban() {
  const B = D.boxoban, R = D.results.boxoban, n = v => v.toLocaleString("en-US");
  return `<div class="view page-head"><div class="tag eyebrow">Real levels</div><h2>Boxoban</h2>
    <p class="lede">A public set of 10 by 10 Sokoban levels with four boxes each, made by DeepMind. We did not write these levels. Here a search proposes the plan, and the dead corner checker prunes it.</p></div>
  <div class="stage" style="margin-top:26px"><div class="boardwrap" id="left"></div><div class="panel" id="right">
    <div><div class="tag" style="margin-bottom:8px">Medium set, level ${B.index}, ${n(B.budget)} nodes per search</div>
      <div class="cmp">
        <div class="cmpc lose"><span class="tag">No pruning</span><div class="big">No plan</div><div class="sub">Budget used up.${B.plain_needs ? ` It needs about ${n(B.plain_needs)} nodes.` : ""}</div></div>
        <div class="cmpc win"><span class="tag">With checker</span><div class="big">${B.moves} moves</div><div class="sub">Found after ${n(B.prune_nodes)} nodes.</div></div>
      </div></div>
    <div><div class="tag" style="margin-bottom:8px">The plan, move by move</div><div class="chips" id="chips"></div></div></div></div>
  <section class="res" style="margin-top:36px"><div><h3>Across ${n(R[0].levels * 3)} levels</h3>
    <p class="claim">Share of ${n(R[0].levels)} levels per set solved within a search budget. Pruning dead corners solves more at every budget, in every set.</p>
    <div class="seg" role="group" aria-label="Boxoban set" style="margin-top:12px">${R.map((b, i) => `<button data-bset="${i}" aria-pressed="${i === boxSet}">${b.name}</button>`).join("")}</div></div>
    <div class="rows" id="boxrows">${boxRows(boxSet)}</div></section>`;
}
function mountBoxoban() {
  const B = D.boxoban, steps = B.actions.map((a, i) => ({a, s: B.states[i], ok: true, conf: 1}));
  $("#chips").innerHTML = chipsHtml(steps, "plain");
  let mark;
  player = makePlayer($("#left"), "boxoban", framesFrom(B, steps), i => mark && mark(i));
  mark = bindChips($("#right"), player); mark(0);
}

const bar = (label, pct, cls = "") => `<div class="rowbar" style="grid-template-columns:70px minmax(0,1fr) 76px"><span class="picked">${label}</span><div class="bar"><span class="${cls}" style="width:${Math.max(1, pct)}%"></span></div><span class="v">${pct}%</span></div>`;
function hardData(i) {
  const H = D.results.hard, f = v => Math.round(v * 100), n = v => Math.round(v).toLocaleString("en-US");
  if (i === 0) return {
    claim: "Positions built by playing jumps backwards from the goal, so each one can be solved. Share solved within a fixed search budget. The pagoda bound prunes lost branches.",
    rows: Object.entries(H.peg).map(([k, r]) => `<div class="duo"><span style="font-size:14px">${k} jumps from the goal</span>${bar("no checker", f(r.plain.solved))}${bar("with checker", f(r.checker.solved), "acc")}
      <span class="picked">Mean nodes: ${n(r.plain.nodes)} without, ${n(r.checker.nodes)} with.</span></div>`).join("")};
  const data = i === 1 ? H.puzzle : H.cube;
  return {
    claim: i === 1 ? "Random scrambles of the 24-puzzle, solved by weighted A*. The parity rule never changes a result on a solvable start. On an unsolvable start it saves the whole search."
      : "Scrambled 3x3x3 cubes, solved by meeting in the middle. The invariant rules never change a result on a solvable cube. On a cube with a twisted corner they save the whole search.",
    rows: Object.entries(data).map(([k, r]) => `<div class="duo"><span style="font-size:14px">${k} scramble moves</span>${bar("solved", f(r.solved), "acc")}
      <span class="picked">Unsolvable start: ${n(r.waste_plain)} nodes wasted without the check, ${n(r.waste_gate)} with it.</span></div>`).join("")};
}
function hardBlock() {
  const d = hardData(hardSet), names = ["Peg Solitaire", "24-Puzzle", "Rubik's Cube"];
  return `<div class="res"><div><h3>Harder games</h3><p class="claim" id="hclaim">${d.claim}</p>
    <div class="seg" role="group" aria-label="Harder game" style="margin-top:12px">${names.map((m, i) => `<button data-hset="${i}" aria-pressed="${i === hardSet}">${m}</button>`).join("")}</div></div>
    <div class="rows" id="hrows">${d.rows}</div></div>`;
}
function viewResults() {
  const R = D.results, ms = Math.max(...R.speed.map(x => x.base)), hard = R.boxoban[2].rows.at(-1);
  const lo = -1.0, hi = 0.3, W = 460, rowH = 34, H = R.memory.length * rowH + 44;
  const X = v => 150 + (v - lo) / (hi - lo) * (W - 170);
  const mem = R.memory.map((m, i) => {
    const y = 22 + i * rowH, help = m.diff + 2 * m.se < 0;
    return `<text class="nm" x="0" y="${y + 4}">${esc(m.name.replace("sokoban-", "Sokoban ").replace("river-crossing", "River").replace("rush-hour", "Rush Hour").replace("Sokoban simple", "Sokoban 1 box").replace("Sokoban multi", "Sokoban 2 box"))}</text>
      <line x1="${X(m.diff - m.se)}" x2="${X(m.diff + m.se)}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="${X(m.diff)}" cy="${y}" r="6" fill="${help ? "var(--ok)" : "var(--muted)"}" stroke="var(--ink)" stroke-width="2"/>
      <text x="${W - 4}" y="${y + 4}" text-anchor="end">${m.diff > 0 ? "+" : ""}${m.diff.toFixed(2)}</text>`;
  }).join("");
  return `<div class="view page-head"><div class="tag eyebrow">What we measured</div><h2>Results</h2>
  <p class="lede">Each row is a different experiment. Full tables are in the results folder of the repository.</p></div>
  <div class="results">
    <div class="res"><div><h3>Safety</h3><p class="claim">On River Crossing the plain planner reaches the goal every time, but breaks the rules on the way. With the checker it does not.</p></div>
      <div class="rows">
        <div class="rowbar"><span>Without checker</span><div class="bar"><span class="bad" style="width:${Math.max(1, R.river.baseline * 100)}%"></span></div><span class="v">${(R.river.baseline * 100).toFixed(0)}% safe</span></div>
        <div class="rowbar"><span>With checker</span><div class="bar"><span class="good" style="width:${R.river.validated * 100}%"></span></div><span class="v">${(R.river.validated * 100).toFixed(0)}% safe</span></div>
        <p class="picked">Reached the goal without the checker: ${(R.river.raw * 100).toFixed(0)}%. Safe means no move broke a rule.</p></div></div>
    <div class="res"><div><h3>Speed</h3><p class="claim">Planning time per episode, in milliseconds. The adaptive solver helps where one piece moves and ties elsewhere.</p></div>
      <div class="rows">${R.speed.map(x => `<div class="duo"><span style="font-size:14px">${esc(x.name)}</span>
        <div class="rowbar" style="grid-template-columns:70px minmax(0,1fr) 76px"><span class="picked">always CP-SAT</span><div class="bar"><span style="width:${x.base / ms * 100}%"></span></div><span class="v">${x.base.toFixed(1)} ms</span></div>
        <div class="rowbar" style="grid-template-columns:70px minmax(0,1fr) 76px"><span class="picked">adaptive</span><div class="bar"><span class="acc" style="width:${Math.max(1, x.adaptive / ms * 100)}%"></span></div><span class="v">${x.adaptive.toFixed(1)} ms</span></div></div>`).join("")}</div></div>
    <div class="res"><div><h3>Real levels</h3><p class="claim">Boxoban is a public set of Sokoban levels. On the hard set, at the largest search budget, ${hard.plain}% of levels are solved without the checker and ${hard.prune}% with it.</p></div>
      <div><button class="btn" data-goto="boxoban">Open the Boxoban tab</button></div></div>
    ${hardBlock()}
    <div class="res"><div><h3>Memory</h3><p class="claim">Change in replans per episode when the system remembers failed moves. Left of zero is better. Bars show one standard error.</p></div>
      <svg class="forest" viewBox="0 0 ${W} ${H}" role="img" aria-label="Replan change per game">${mem}
        <line x1="${X(0)}" x2="${X(0)}" y1="6" y2="${H - 26}" stroke="var(--muted)" stroke-dasharray="4 4"/>
        <text x="${X(0)}" y="${H - 8}" text-anchor="middle">0</text><text x="${X(-0.6)}" y="${H - 8}" text-anchor="middle">fewer replans</text></svg></div>
    <div class="limits"><h3>What this does not show</h3><ul>
      <li>Planners here are synthetic. No language model was used, so results say nothing about real model failures.</li>
      <li>The checker filters bad plans. It cannot invent a plan that no proposal contains.</li>
      <li>Tuning the cost weights found nothing better than the defaults.</li>
      <li>On Boxoban the checker is the standard dead corner rule, and the merged path is never shorter than the best single plan.</li>
      <li>Memory gave no gain on two box Sokoban, and Rush Hour is within noise.</li>
      <li>On the 24-puzzle and the cube the checker only guards the start. It changes no result on a solvable one.</li>
      <li>Harder game scrambles are random walks, easier than random instances, and the cube is tested only to 8 move scrambles.</li></ul></div>
  </div>`;
}

/* ---------- routing ---------- */
const hashFor = () => GAMES.includes(state.tab) ? `${state.tab}-${state.stage}` : state.tab;
function fromHash() {
  const [t, s] = location.hash.slice(1).split("-");
  state.tab = TABS.some(x => x.id === t) ? t : "overview";
  if (STAGES.some(x => x.id === s)) state.stage = s;
}
function go(tab, stage) {
  state.tab = tab;
  if (stage) state.stage = stage;
  if (location.hash.slice(1) !== hashFor()) location.hash = hashFor();
  render();
}

function render() {
  if (player) { player.stop(); player = null; }
  $("#tabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" aria-selected="${t.id === state.tab}" data-goto="${t.id}">${t.label}</button>`).join("");
  const t = state.tab;
  const html = t === "overview" ? viewOverview() : t === "boxoban" ? viewBoxoban() : t === "results" ? viewResults() : viewGame(t);
  $("#main").innerHTML = html + `<footer class="foot">Every board, plan and number on this page comes from a live run of the project code. Source: github.com/Harsh-v69/MachineLearningCP</footer>`;
  if (t === "overview") document.querySelectorAll("[data-thumb]").forEach(el => {
    const id = el.dataset.thumb, b = id === "boxoban" ? sokobanBoard(D.boxoban) : BOARDS[id](G[id]);
    b.show(id === "boxoban" ? D.boxoban.start : G[id].start);
    el.appendChild(b.svg);
  });
  if (GAMES.includes(t)) ({propose: mountPropose, check: mountCheck, choose: mountChoose, run: mountRun}[state.stage] || (() => {}))(t);
  if (t === "boxoban") mountBoxoban();
  window.scrollTo(0, 0);
}

/* ---------- theme ---------- */
const root = document.documentElement;
const effectiveTheme = () => root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function syncTheme() { document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === effectiveTheme())); }
try { const saved = localStorage.getItem("plancheck-theme"); if (saved === "light" || saved === "dark") root.dataset.theme = saved; } catch (e) {}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme);

document.addEventListener("click", e => {
  const th = e.target.closest("[data-theme-set]");
  if (th) {
    root.dataset.theme = th.dataset.themeSet;
    try { localStorage.setItem("plancheck-theme", th.dataset.themeSet); } catch (err) {}
    syncTheme();
    return;
  }
  const hs = e.target.closest("[data-hset]");
  if (hs) {
    hardSet = +hs.dataset.hset;
    document.querySelectorAll("[data-hset]").forEach(b => b.setAttribute("aria-pressed", b === hs));
    const d = hardData(hardSet);
    $("#hclaim").textContent = d.claim;
    $("#hrows").innerHTML = d.rows;
    return;
  }
  const bs = e.target.closest("[data-bset]");
  if (bs) {
    boxSet = +bs.dataset.bset;
    document.querySelectorAll("[data-bset]").forEach(b => b.setAttribute("aria-pressed", b === bs));
    $("#boxrows").innerHTML = boxRows(boxSet);
    return;
  }
  const nd = e.target.closest("[data-node]");
  if (nd) {
    nodeIdx = +nd.dataset.node;
    document.querySelectorAll("[data-node]").forEach(b => b.setAttribute("aria-pressed", b === nd));
    $("#detail").innerHTML = detailHtml(nodeIdx);
    return;
  }
  const st = e.target.closest("[data-stage]");
  if (st) return go(state.tab, st.dataset.stage);
  const t = e.target.closest("[data-goto]");
  if (t) { const [tab, stage] = t.dataset.goto.split("-"); go(tab, stage); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.altKey || e.ctrlKey || e.metaKey || !GAMES.includes(state.tab)) return;
  const i = STAGES.findIndex(s => s.id === state.stage);
  if (e.key === "ArrowRight" && i < STAGES.length - 1) go(state.tab, STAGES[i + 1].id);
  if (e.key === "ArrowLeft" && i > 0) go(state.tab, STAGES[i - 1].id);
});
window.addEventListener("hashchange", () => { if (location.hash.slice(1) !== hashFor()) { fromHash(); render(); } });
fromHash();
syncTheme();
render();
</script>
