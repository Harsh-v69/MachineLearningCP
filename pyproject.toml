[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tapegraph"
version = "1.0.0"
description = "TAPE as an LLM-free path-finding algorithm: solvers, benchmarks and a re-planning loop on implicit state graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "ortools"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tapegraph = "tapegraph.bench:main"

[tool.setuptools.packages.find]
include = ["tapegraph*"]
